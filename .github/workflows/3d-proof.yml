name: 3D proof

# Runs the geometry proofs and re-gates every checked-in generator as if it were a fresh
# candidate. Three jobs, so a failure says which layer broke:
#
#   checkers  the gate scripts' own regression tests, which are gear-independent
#   proof     proof/run.sh, which builds every gear's proof against pinned engine revisions
#   port      port/, which generates the gears ported from decad-gallery and fails when a
#             checked-in ported gear differs from a fresh generation
#
# Every gear is generated by the port, so the per-gear gates job that ran a compiled step list's
# compile check, playbook-citation check and gate battery was removed with the last gear to leave
# the compile+emit pipeline. A gear that takes that pipeline again needs the job back: restore it
# from git history, one matrix leg per gear. check_step_calls.py's WorkflowGateWiringTest fails the
# build if a compiled, unported gear has no leg.
#
# The engines publish no tags, so a SHA is the only stable handle. Bumping one is a deliberate
# PR, and these proofs are what decide whether the new engine is acceptable.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # The sketch and decad revisions are NOT written here. proof/go.mod already
  # pins them, in the pseudo-version Go records for a module with no tags, and
  # the proof job reads that so CI and a local proof/run.sh use one revision.
  # Only `go get` moves a pin, and it moves it in one place.
  FUSION_API_COMMIT: a5e6aa196bd3e21d11e1b936415caadd1ed6bf0c
  # The gate scripts and their tests run on this Python, not on whatever the runner image ships.
  # test_check_compile.py compares Python's Unicode tables with Go's, and Python releases carry
  # newer tables than Go: Go 1.26 has Unicode 15.0.0, which Python 3.12 matches. An unpinned
  # runner Python newer than that failed the comparison from code point 67008 upward. Move this
  # pin only to a Python whose `unicodedata.unidata_version` equals Go's `unicode.Version`.
  PYTHON_VERSION: '3.12'

jobs:
  checkers:
    name: Gate script tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the gear repository
        uses: actions/checkout@v4
        with:
          path: gears

      - name: Check out the Fusion API lookup database
        uses: actions/checkout@v4
        with:
          repository: lestrrat-ai/claude-code-plugins
          ref: ${{ env.FUSION_API_COMMIT }}
          path: fusion-api
          sparse-checkout: |
            plugins/fusion/skills/query-api/data
            plugins/fusion/skills/query-api/scripts
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install gate dependencies
        env:
          FUSION_API_STUBS: ${{ runner.temp }}/FusionAPIReference/Fusion_API_Python_Reference/defs
          FUSION_QUERY_API: ${{ github.workspace }}/fusion-api/plugins/fusion/skills/query-api/scripts/query_fusion_api.py
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input pyright
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/AutodeskFusion360/FusionAPIReference.git "$RUNNER_TEMP/FusionAPIReference"
          git -C "$RUNNER_TEMP/FusionAPIReference" sparse-checkout set Fusion_API_Python_Reference/defs
          test -f "$FUSION_QUERY_API"
          test -f "$FUSION_API_STUBS/adsk/core.py"
          {
            echo "FUSION_QUERY_API=$FUSION_QUERY_API"
            echo "FUSION_API_STUBS=$FUSION_API_STUBS"
          } >> "$GITHUB_ENV"

      # The checker suite shells out to the real Go toolchain (test_check_compile.py asks
      # what it makes of odd build-constraint headers), so it needs the same pinned Go the
      # proofs use. Without this the job silently tests against whatever Go the runner ships.
      #
      # It never builds proof/: every package it compiles is a throwaway fixture module written
      # into a temporary directory with no requirements, so there is no dependency cache worth
      # keeping. Caching is off rather than pointed at gears/proof/go.sum on purpose. The cache
      # key setup-go derives from that file would be identical in both jobs, entries are
      # immutable, and this job finishes minutes before the proofs do — so it would claim the
      # key with stdlib fixture artifacts and lock the geometry job's real cache out.
      - uses: actions/setup-go@v5
        with:
          go-version-file: gears/proof/go.mod
          cache: false

      - name: Run checker regression tests
        run: python3 -m unittest discover -s .claude/skills/generate-gear -p 'test_*.py'
        working-directory: gears

  proof:
    name: Geometry proofs
    runs-on: ubuntu-latest
    steps:
      - name: Check out the gear repository
        uses: actions/checkout@v4
        with:
          path: gears

      - name: Read the engine revisions proof/go.mod pins
        run: |
          set -euo pipefail
          pin() {
            sed -n "s|^[[:space:]]*github.com/lestrrat-3d/$1 v[^ ]*-\([0-9a-f]\{12\}\)$|\1|p" \
              proof/go.mod | head -1
          }
          sketch=$(pin sketch)
          test -n "$sketch" || { echo "proof/go.mod pins no sketch revision" >&2; exit 1; }
          decad=$(pin decad)
          test -n "$decad" || { echo "proof/go.mod pins no decad revision" >&2; exit 1; }
          {
            echo "SKETCH_COMMIT=$sketch"
            echo "DECAD_COMMIT=$decad"
          } | tee -a "$GITHUB_ENV"
        working-directory: gears

      # Cloned in full and moved to the pinned commit below, rather than passed as
      # `ref`. go.mod records a 12-digit short commit, and actions/checkout reads
      # anything shorter than a full 40-digit SHA as a branch or tag name — it
      # fetches refs/heads/<value>* and fails when nothing matches.
      - name: Check out the sketch engine
        uses: actions/checkout@v4
        with:
          repository: lestrrat-3d/sketch
          fetch-depth: 0
          path: sketch

      - name: Check out the decad engine
        uses: actions/checkout@v4
        with:
          repository: lestrrat-3d/decad
          fetch-depth: 0
          path: decad

      - name: Move the engines to the revisions proof/go.mod pins
        run: |
          set -euo pipefail
          git -C "$GITHUB_WORKSPACE/sketch" checkout --detach "$SKETCH_COMMIT"
          git -C "$GITHUB_WORKSPACE/decad" checkout --detach "$DECAD_COMMIT"
          echo "sketch now at $(git -C "$GITHUB_WORKSPACE/sketch" rev-parse --short=12 HEAD)"
          echo "decad now at $(git -C "$GITHUB_WORKSPACE/decad" rev-parse --short=12 HEAD)"

      # setup-go's own caching is off, and the two steps below do the work instead. It derives
      # ONE key from the dependency files alone, and it hands actions/cache no restore-keys at
      # all: its cache-restore.ts calls restoreCache with a primary key and nothing else. Two
      # things follow, and the second is a defect.
      #
      # A cache entry is never rewritten. When the restore hits the primary key actions/cache
      # skips the save, so a key that stays the same while its contents go stale is not a cold
      # cache, it is a permanently wrong one. Editing a proof source moves no dependency file,
      # so under setup-go's key the entry froze at whatever the run that created it stored, the
      # edited package re-executed on every run from then on, and nothing was ever saved. That
      # was measured on a throwaway branch: after one source edit, two runs with identical
      # inputs each re-ran the edited package and each logged "not saving cache".
      #
      # Adding the sources to cache-dependency-path would fix the staleness and lose the
      # fallback, because setup-go has no restore-keys: every source edit would miss outright
      # and re-download the module cache with it. So the two caches are separated here. The
      # module cache's content is decided by the dependency files alone. The build and test
      # cache's content is decided by those AND by the proof sources, which decide the test
      # binary Go's test cache matches on, and it carries the fallbacks setup-go cannot: the
      # first recovers a sibling entry built from the same module graph, so a source edit costs
      # one execution rather than a rebuild as well, and the second matches the key shape used
      # before the source component existed.
      #
      # Every path below is workspace-relative, and the repository is checked out into gears/,
      # so the module sits at gears/proof/.
      - uses: actions/setup-go@v5
        with:
          go-version-file: gears/proof/go.mod
          cache: false

      - name: Restore the module cache
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: proof-mod-${{ runner.os }}-${{ hashFiles('gears/proof/go.sum', 'gears/proof/go.mod') }}

      - name: Restore the build and test cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: proof-build-${{ runner.os }}-${{ hashFiles('gears/proof/go.sum', 'gears/proof/go.mod') }}-${{ hashFiles('gears/proof/**/*.go') }}
          restore-keys: |
            proof-build-${{ runner.os }}-${{ hashFiles('gears/proof/go.sum', 'gears/proof/go.mod') }}-
            proof-build-${{ runner.os }}-

      - name: Run proof runner regression tests
        run: bash proof/run_test.sh
        working-directory: gears

      - name: Run the proofs
        env:
          SKETCH_DIR: ${{ github.workspace }}/sketch
          DECAD_DIR: ${{ github.workspace }}/decad
          PROOF_VERIFY_REVISIONS: '1'
        run: ./run.sh
        working-directory: gears/proof

  port:
    name: Gallery port
    runs-on: ubuntu-latest
    steps:
      - name: Check out the gear repository
        uses: actions/checkout@v4

      # port/go.mod pins the decad-gallery revision the ported gears are generated from, and the
      # Go module cache supplies that source, so no sibling checkout is needed.
      - uses: actions/setup-go@v5
        with:
          go-version-file: port/go.mod
          cache: false

      # The differential tests run the Python translation of the gallery's Go helpers, and the
      # same Python runs the generated add-in's syntax check.
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run the port tests
        run: go test ./...
        working-directory: port

      - name: Check lib/geargen/spurgear.py is what the port generates
        run: |
          go build -C port -o ../.tmp/gearport ./cmd/gearport
          .tmp/gearport check spurgear

      - name: Check lib/geargen/helicalgear.py is what the port generates
        run: |
          go build -C port -o ../.tmp/gearport ./cmd/gearport
          .tmp/gearport check helicalgear

      - name: Check lib/geargen/herringbonegear.py is what the port generates
        run: |
          go build -C port -o ../.tmp/gearport ./cmd/gearport
          .tmp/gearport check herringbonegear

      - name: Check lib/geargen/bevelgear.py is what the port generates
        run: |
          go build -C port -o ../.tmp/gearport ./cmd/gearport
          .tmp/gearport check bevelgear

      - name: Check lib/geargen/cycloidal.py is what the port generates
        run: |
          go build -C port -o ../.tmp/gearport ./cmd/gearport
          .tmp/gearport check cycloidal
