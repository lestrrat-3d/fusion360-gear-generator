name: 3D proof

# Checks that every generated gear add-in is what the port produces from the pinned decad-gallery
# revision, that every add-in compiles and imports with the Fusion modules stubbed, and that every object
# the add-ins create in Fusion is named by its role. Two jobs:
#
#   port    port/, which generates the gears from decad-gallery and fails when a checked-in gear
#           differs from a fresh generation
#   addins  tests/, which fails when an add-in does not compile or import, or creates a sketch, plane,
#           feature or body without a name
#
# The gallery proves each gear's geometry in its own repository. This repository holds no proof.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.12'

jobs:
  addins:
    name: Add-in checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out the gear repository
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Compile and import the add-ins, and check every created object is named
        run: python3 -m unittest discover -s tests -p 'test_*.py'

  port:
    name: Gallery port
    runs-on: ubuntu-latest
    steps:
      - name: Check out the gear repository
        uses: actions/checkout@v4

      # port/go.mod pins the decad-gallery revision the ported gears are generated from, and the
      # Go module cache supplies that source, so no sibling checkout is needed.
      - uses: actions/setup-go@v5
        with:
          go-version-file: port/go.mod
          cache: false

      # The differential tests run the Python translation of the gallery's Go helpers, and the
      # same Python runs the generated add-in's syntax check.
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
        working-directory: port

      - name: Vet the port
        run: go vet ./...
        working-directory: port

      - name: Lint the port
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.12.2
          working-directory: port

      - name: Run the port tests
        run: go test ./...
        working-directory: port

      - name: Build gearport
        run: |
          mkdir -p .tmp
          go build -C port -o ../.tmp/gearport ./cmd/gearport

      # One gear per fragment under port/<dir>/fragments/. Every gear is checked and every stale
      # one is named before the step fails.
      - name: Check every lib/geargen/<gear>.py is what the port generates
        run: scripts/check-generated-gears.sh .tmp/gearport
